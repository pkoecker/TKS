<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        http-equiv="Cache-Control"
        content="no-cache, no-store, must-revalidate"
    >

    <meta
        http-equiv="Pragma"
        content="no-cache"
    >

    <meta
        http-equiv="Expires"
        content="0"
    >

    <title>E3/DC – Did you know?</title>


    <style>

        /* =========================================================
           GRUNDEINSTELLUNGEN
           ========================================================= */

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #ffffff;
            color: #1a1a1a;
        }


        /* =========================================================
           GESAMTER BILDSCHIRM
           ========================================================= */

        #screen {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #ffffff;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        #header {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 11vh;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding:
                2vh
                4vw
                1vh
                3vw;

            z-index: 100;
        }


        #did-you-know {
            font-size: 2.5vh;
            font-weight: 600;

            color: #555555;
        }


        #logo {
            width: auto;
            height: 7vh;

            object-fit: contain;
        }


        /* =========================================================
           SLIDE-BEREICH
           ========================================================= */

        #slide-container {
            position: absolute;

            top: 11vh;
            left: 0;
            right: 0;
            bottom: 0;

            padding:
                1vh
                4vw
                4vh
                4vw;

            overflow: hidden;

            /*
             * iiSignage meldet:
             * 1280 x 720 CSS-Pixel
             * DPR 3
             */
            font-size: 21px;
        }


        /*
         * Wrapper um den gesamten Inhalt
         * der aktuellen Slide.
         */
        #slide-content {
            width: 100%;

            transform-origin: top left;
        }


        /* =========================================================
           DEUTSCHER BEREICH
           ========================================================= */

        .german {
            margin-bottom: 1.45em;
        }


        /* =========================================================
           ENGLISCHER BEREICH
           ========================================================= */

        .english {
            border-top: 2px solid #dddddd;

            padding-top: 1.2em;
        }


        /* =========================================================
           ÜBERSCHRIFTEN
           ========================================================= */

        h1 {
            margin:
                0
                0
                0.55em
                0;

            font-size: 1.65em;
            line-height: 1.15;

            font-weight: 700;
        }


        h2 {
            margin:
                0
                0
                0.55em
                0;

            font-size: 1.35em;
            line-height: 1.15;

            font-weight: 700;
        }


        /* =========================================================
           INHALT
           ========================================================= */

        .content {
            font-size: 1em;
            line-height: 1.4;
        }


        .content p {
            margin:
                0
                0
                0.65em
                0;
        }


        /* =========================================================
           LISTEN
           ========================================================= */

        .content ul,
        .content ol {
            margin:
                0.35em
                0
                0.7em
                0;

            padding-left: 1.2em;
        }


        .content li {
            margin-bottom: 0.15em;
        }


        /* =========================================================
           BILDER ALLGEMEIN
           ========================================================= */

        .content img {
            display: block;

            width: auto;
            height: auto;

            max-width: 100%;
            max-height: 36vh;

            object-fit: contain;
        }


        /*
         * Einzelne Bilder, die direkt im Content liegen,
         * dürfen etwas größer angezeigt werden.
         */
        .content > img {
            max-width: 45%;
            max-height: 36vh;

            margin-left: auto;
            margin-right: auto;
        }


        /* =========================================================
           ZWEISPALTIGES LAYOUT
           ========================================================= */

        .two-columns {
            display: flex;

            width: 100%;

            gap: 2em;

            align-items: center;
        }


        /*
         * Standardverhalten:
         * Beide Spalten teilen sich den Platz.
         */
        .two-columns > div {
            flex: 1 1 50%;

            min-width: 0;
        }


        /*
         * Diese Klasse wird automatisch per JavaScript gesetzt,
         * wenn in einer Spalte ein Bild gefunden wird.
         */
        .two-columns > .auto-image-column {
            flex: 0 1 42%;

            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 18vh;
        }


        /*
         * Textspalte bekommt den restlichen Platz.
         */
        .two-columns > .auto-text-column {
            flex: 1 1 58%;
        }


        /*
         * Bilder in automatisch erkannten Bildspalten
         * dürfen bewusst hochskaliert werden.
         */
        .two-columns > .auto-image-column img {
            display: block;

            width: 100%;
            height: auto;

            max-width: 100%;
            max-height: 36vh;

            margin: 0 auto;

            object-fit: contain;
        }


        /* =========================================================
           TABELLEN
           ========================================================= */

        .content table {
            width: 100%;

            border-collapse: collapse;
        }


        .content th,
        .content td {
            padding: 0.35em 0.5em;

            border-bottom: 1px solid #dddddd;

            text-align: left;
        }


        /* =========================================================
           SLIDE-METADATEN
           ========================================================= */

        .slide-meta {
            display: none;
        }


        /* =========================================================
           QR-CODE
           ========================================================= */

        #qr-area {
            position: absolute;

            right: 3vw;
            bottom: 3vh;

            z-index: 200;

            display: none;

            align-items: center;

            gap: 1vw;

            padding: 0.7vh 0.5vw;

            background: #ffffff;
        }


        #qr-code {
            width: 10vh;
            height: 10vh;
        }


        #qr-code img,
        #qr-code canvas {
            display: block;

            width: 10vh !important;
            height: 10vh !important;
        }


        #qr-label {
            font-size: 1.4vh;
            line-height: 1.3;

            color: #666666;
        }


        /* =========================================================
           SYSTEMMELDUNGEN
           ========================================================= */

        .message {
            padding-top: 10vh;

            font-size: 3vh;

            color: #555555;
        }

    </style>

</head>


<body>


<div id="screen">


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header id="header">

        <div id="did-you-know">
            Did you know...?
        </div>


        <img
            id="logo"
            src="assets/e3dc-logo.png"
            alt="E3/DC"
        >

    </header>



    <!-- =========================================================
         SLIDE-BEREICH
         ========================================================= -->

    <main id="slide-container">

        <div class="message">
            Slide wird geladen...
        </div>

    </main>



    <!-- =========================================================
         QR-CODE
         ========================================================= -->

    <div id="qr-area">

        <div id="qr-code"></div>

        <div id="qr-label">
            Mehr erfahren:<br>
            Learn more:
        </div>

    </div>


</div>



<!-- =============================================================
     QR-CODE-BIBLIOTHEK
     ============================================================= -->

<script src="assets/qrcode.min.js"></script>



<script>

    /* =============================================================
       KONFIGURATION
       ============================================================= */

    const slideDuration = 30000;



    /* =============================================================
       STATUS
       ============================================================= */

    let slides = [];

    let currentSlide = -1;

    let slideTimer = null;

    let loadVersion = 0;



    /* =============================================================
       SLIDE-LISTE LADEN
       ============================================================= */

    async function loadSlideList() {

        const container =
            document.getElementById(
                "slide-container"
            );


        try {

            const response = await fetch(
                "slides.json?v=" + Date.now(),
                {
                    cache: "no-store"
                }
            );


            if (!response.ok) {

                throw new Error(
                    "slides.json konnte nicht geladen werden."
                );

            }


            slides = await response.json();


            if (!Array.isArray(slides)) {

                throw new Error(
                    "slides.json enthält keine gültige Liste."
                );

            }


            if (slides.length === 0) {

                container.innerHTML = `
                    <div class="message">
                        Keine Slides vorhanden.
                    </div>
                `;

                return;

            }


            /*
             * Beim Start zufällige Slide auswählen.
             */
            const firstSlide =
                Math.floor(
                    Math.random() * slides.length
                );


            await showSlide(
                firstSlide
            );


            startTimer();

        }

        catch (error) {

            console.error(error);


            container.innerHTML = `
                <div class="message">
                    Die Slides konnten nicht geladen werden.
                </div>
            `;

        }

    }



    /* =============================================================
       EINZELNE SLIDE LADEN
       ============================================================= */

    async function showSlide(index) {

        if (slides.length === 0) {
            return;
        }


        /*
         * Nach letzter Slide wieder zur ersten.
         */
        if (index >= slides.length) {
            index = 0;
        }


        /*
         * Vor erster Slide wieder zur letzten.
         */
        if (index < 0) {
            index = slides.length - 1;
        }


        const thisLoadVersion =
            ++loadVersion;


        try {

            const separator =
                slides[index].includes("?")
                    ? "&"
                    : "?";


            const slideUrl =
                slides[index]
                + separator
                + "v="
                + Date.now();


            const response = await fetch(
                slideUrl,
                {
                    cache: "no-store"
                }
            );


            if (!response.ok) {

                throw new Error(
                    "Slide konnte nicht geladen werden: "
                    + slides[index]
                );

            }


            const html =
                await response.text();


            /*
             * Falls inzwischen eine neuere Slide
             * angefordert wurde, Antwort ignorieren.
             */
            if (
                thisLoadVersion !== loadVersion
            ) {

                return;

            }


            currentSlide = index;


            const container =
                document.getElementById(
                    "slide-container"
                );


            /*
             * Slide in Wrapper laden.
             */
            container.innerHTML = `
                <div id="slide-content">
                    ${html}
                </div>
            `;


            /*
             * Bestehende Slide automatisch optimieren.
             *
             * Unter anderem werden Bildspalten erkannt
             * und sinnvoll vergrößert.
             */
            optimizeSlideLayout();


            /*
             * QR-Code aktualisieren.
             */
            updateQRCode();


            /*
             * Slide in verfügbaren Bereich einpassen.
             */
            await fitSlide();

        }

        catch (error) {

            console.error(error);


            document.getElementById(
                "slide-container"
            ).innerHTML = `
                <div class="message">
                    Diese Slide konnte nicht geladen werden.
                </div>
            `;

        }

    }



    /* =============================================================
       SLIDE-LAYOUT AUTOMATISCH OPTIMIEREN
       ============================================================= */

    function optimizeSlideLayout() {

        const slide =
            document.getElementById(
                "slide-content"
            );


        if (!slide) {
            return;
        }


        /*
         * Alle zweispaltigen Bereiche untersuchen.
         */
        const twoColumnLayouts =
            slide.querySelectorAll(
                ".two-columns"
            );


        twoColumnLayouts.forEach(layout => {

            const columns =
                Array.from(
                    layout.children
                );


            columns.forEach(column => {

                /*
                 * Eventuell bereits gesetzte automatische
                 * Klassen entfernen.
                 */
                column.classList.remove(
                    "auto-image-column",
                    "auto-text-column"
                );


                /*
                 * Prüfen, ob die Spalte mindestens
                 * ein Bild enthält.
                 */
                const image =
                    column.querySelector("img");


                if (image) {

                    /*
                     * Bildspalte automatisch erkennen.
                     */
                    column.classList.add(
                        "auto-image-column"
                    );

                }

                else {

                    /*
                     * Keine Bilder:
                     * als Textspalte behandeln.
                     */
                    column.classList.add(
                        "auto-text-column"
                    );

                }

            });

        });

    }



    /* =============================================================
       SLIDE AUTOMATISCH EINPASSEN
       ============================================================= */

    async function fitSlide() {

        const container =
            document.getElementById(
                "slide-container"
            );


        const content =
            document.getElementById(
                "slide-content"
            );


        if (!content) {
            return;
        }


        /*
         * Vor Messung immer wieder auf
         * Originalgröße zurücksetzen.
         */
        content.style.transform =
            "scale(1)";


        /*
         * Auf alle Bilder warten.
         */
        const images =
            content.querySelectorAll("img");


        await Promise.all(

            Array.from(images).map(image => {

                if (image.complete) {

                    return Promise.resolve();

                }


                return new Promise(resolve => {

                    image.addEventListener(
                        "load",
                        resolve,
                        {
                            once: true
                        }
                    );


                    image.addEventListener(
                        "error",
                        resolve,
                        {
                            once: true
                        }
                    );

                });

            })

        );


        /*
         * Zwei Renderzyklen warten,
         * damit Größen final berechnet wurden.
         */
        await new Promise(resolve => {

            requestAnimationFrame(() => {

                requestAnimationFrame(
                    resolve
                );

            });

        });


        const style =
            getComputedStyle(container);


        const horizontalPadding =
            parseFloat(style.paddingLeft)
            +
            parseFloat(style.paddingRight);


        const verticalPadding =
            parseFloat(style.paddingTop)
            +
            parseFloat(style.paddingBottom);


        /*
         * Verfügbarer Platz.
         */
        const availableWidth =
            container.clientWidth
            -
            horizontalPadding;


        const availableHeight =
            container.clientHeight
            -
            verticalPadding;


        /*
         * Tatsächliche Slide-Größe.
         */
        const contentWidth =
            content.scrollWidth;


        const contentHeight =
            content.scrollHeight;


        /*
         * Passenden Skalierungsfaktor berechnen.
         */
        let scale =
            Math.min(
                1,
                availableWidth / contentWidth,
                availableHeight / contentHeight
            );


        /*
         * Kleiner Sicherheitspuffer.
         */
        if (scale < 1) {

            scale *= 0.98;

        }


        /*
         * Gesamte Slide proportional skalieren.
         */
        content.style.transform =
            `scale(${scale})`;

    }



    /* =============================================================
       QR-CODE
       ============================================================= */

    function updateQRCode() {

        const qrArea =
            document.getElementById(
                "qr-area"
            );


        const qrContainer =
            document.getElementById(
                "qr-code"
            );


        const slideContainer =
            document.getElementById(
                "slide-container"
            );


        /*
         * Alten QR-Code löschen.
         */
        qrContainer.innerHTML = "";


        /*
         * Metadaten suchen.
         */
        const metadata =
            slideContainer.querySelector(
                ".slide-meta"
            );


        /*
         * Keine Metadaten vorhanden.
         */
        if (!metadata) {

            qrArea.style.display =
                "none";

            return;

        }


        /*
         * URL lesen.
         */
        const url =
            metadata.dataset.qrUrl;


        /*
         * Keine URL vorhanden.
         */
        if (!url) {

            qrArea.style.display =
                "none";

            return;

        }


        /*
         * QR-Code anzeigen.
         */
        qrArea.style.display =
            "flex";


        /*
         * QR-Code erzeugen.
         */
        new QRCode(
            qrContainer,
            {
                text: url,

                width: 300,
                height: 300,

                colorDark: "#000000",
                colorLight: "#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );

    }



    /* =============================================================
       ZUFÄLLIGE SLIDE BESTIMMEN
       ============================================================= */

    function getRandomSlide() {

        if (slides.length <= 1) {

            return 0;

        }


        let nextSlide;


        do {

            nextSlide =
                Math.floor(
                    Math.random()
                    * slides.length
                );

        }

        while (
            nextSlide === currentSlide
        );


        return nextSlide;

    }



    /* =============================================================
       ZUFÄLLIGE SLIDE ANZEIGEN
       ============================================================= */

    async function showRandomSlide() {

        const nextSlide =
            getRandomSlide();


        await showSlide(
            nextSlide
        );

    }



    /* =============================================================
       TIMER
       ============================================================= */

    function startTimer() {

        if (slideTimer !== null) {

            clearInterval(
                slideTimer
            );

        }


        slideTimer =
            setInterval(

                () => {

                    showRandomSlide();

                },

                slideDuration

            );

    }



    /* =============================================================
       MANUELLE NAVIGATION
       ============================================================= */

    async function nextSlide() {

        await showSlide(
            currentSlide + 1
        );


        /*
         * Timer nach manueller Navigation neu starten.
         */
        startTimer();

    }



    async function previousSlide() {

        await showSlide(
            currentSlide - 1
        );


        startTimer();

    }



    /* =============================================================
       TASTATURSTEUERUNG
       ============================================================= */

    document.addEventListener(

        "keydown",

        event => {

            /*
             * Pfeil rechts:
             * nächste Slide.
             */
            if (
                event.key ===
                "ArrowRight"
            ) {

                event.preventDefault();

                nextSlide();

            }


            /*
             * Pfeil links:
             * vorherige Slide.
             */
            else if (
                event.key ===
                "ArrowLeft"
            ) {

                event.preventDefault();

                previousSlide();

            }

        }

    );



    /* =============================================================
       VIEWPORT-ÄNDERUNG
       ============================================================= */

    window.addEventListener(
        "resize",

        async () => {

            /*
             * Layout erneut optimieren,
             * falls sich die Größe verändert.
             */
            optimizeSlideLayout();

            await fitSlide();

        }
    );



    /* =============================================================
       START
       ============================================================= */

    loadSlideList();


</script>


</body>

</html>
