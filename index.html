<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E3/DC – Did you know?</title>


    <style>

        /* =========================================================
           GRUNDEINSTELLUNGEN
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #ffffff;
            color: #1a1a1a;
        }


        /* =========================================================
           GESAMTER BILDSCHIRM
           ========================================================= */

        #screen {
            position: relative;

            width: 100vw;
            height: 100vh;

            overflow: hidden;

            background: #ffffff;
        }


        /* =========================================================
           HEADER
           ========================================================= */

        #header {
            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 11vh;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding:
                2vh
                4vw
                1vh
                3vw;

            z-index: 100;
        }


        #did-you-know {
            font-size: 2.5vh;
            font-weight: 600;

            color: #555555;
        }


        #logo {
            width: auto;
            height: 7vh;

            object-fit: contain;
        }


        /* =========================================================
           SLIDE-BEREICH
           ========================================================= */

        #slide-container {
            position: absolute;

            top: 11vh;
            left: 0;
            right: 0;
            bottom: 0;

            padding:
                1vh
                4vw
                4vh
                4vw;

            overflow: hidden;

            /*
             * Ausgangsgröße.
             *
             * Wenn die Slide nicht passt, wird nicht nur die Schrift,
             * sondern der gesamte Slide-Inhalt proportional skaliert.
             */
            font-size: 32px;
        }


        /*
         * Wrapper um die jeweils geladene Slide.
         *
         * Dieser gesamte Bereich wird bei Bedarf skaliert.
         */
        #slide-content {
            width: 100%;

            transform-origin: top left;
        }


        /* =========================================================
           DEUTSCHER BEREICH
           ========================================================= */

        .german {
            margin-bottom: 1.45em;
        }


        /* =========================================================
           ENGLISCHER BEREICH
           ========================================================= */

        .english {
            border-top: 2px solid #dddddd;

            padding-top: 1.2em;
        }


        /* =========================================================
           ÜBERSCHRIFTEN
           ========================================================= */

        h1 {
            margin:
                0
                0
                0.55em
                0;

            font-size: 1.65em;
            line-height: 1.15;

            font-weight: 700;
        }


        h2 {
            margin:
                0
                0
                0.55em
                0;

            font-size: 1.35em;
            line-height: 1.15;

            font-weight: 700;
        }


        /* =========================================================
           INHALT
           ========================================================= */

        .content {
            font-size: 1em;
            line-height: 1.4;
        }


        .content p {
            margin:
                0
                0
                0.65em
                0;
        }


        /* =========================================================
           LISTEN
           ========================================================= */

        .content ul,
        .content ol {
            margin:
                0.35em
                0
                0.7em
                0;

            padding-left: 1.2em;
        }


        .content li {
            margin-bottom: 0.15em;
        }


        /* =========================================================
           BILDER
           ========================================================= */

        .content img {
            max-width: 100%;
            max-height: 32vh;

            object-fit: contain;
        }


        /* =========================================================
           ZWEISPALTIGES LAYOUT
           ========================================================= */

        .two-columns {
            display: flex;

            gap: 2em;

            align-items: center;
        }


        .two-columns > div {
            flex: 1;

            min-width: 0;
        }


        .two-columns img {
            display: block;

            max-width: 100%;
            max-height: 30vh;

            margin: 0 auto;

            object-fit: contain;
        }


        /* =========================================================
           TABELLEN
           ========================================================= */

        .content table {
            width: 100%;

            border-collapse: collapse;
        }


        .content th,
        .content td {
            padding: 0.35em 0.5em;

            border-bottom: 1px solid #dddddd;

            text-align: left;
        }


        /* =========================================================
           SLIDE-METADATEN
           ========================================================= */

        /*
         * Diese Elemente enthalten lediglich Konfiguration
         * wie die QR-Code-URL und sollen nicht sichtbar sein.
         */
        .slide-meta {
            display: none;
        }


        /* =========================================================
           QR-CODE
           ========================================================= */

        #qr-area {
            position: absolute;

            right: 3vw;
            bottom: 3vh;

            z-index: 200;

            display: none;

            align-items: center;

            gap: 1vw;

            padding: 0.7vh 0.5vw;

            background: #ffffff;
        }


        #qr-code {
            width: 10vh;
            height: 10vh;
        }


        #qr-code img,
        #qr-code canvas {
            display: block;

            width: 10vh !important;
            height: 10vh !important;
        }


        #qr-label {
            font-size: 1.4vh;
            line-height: 1.3;

            color: #666666;
        }


        /* =========================================================
           SYSTEMMELDUNGEN
           ========================================================= */

        .message {
            padding-top: 10vh;

            font-size: 3vh;

            color: #555555;
        }


        /* =========================================================
           DEBUG-ANZEIGE
           ========================================================= */

        /*
         * Vorübergehend eingebaut, damit wir sehen können,
         * welchen Viewport der iiSignage-Browser tatsächlich meldet.
         *
         * Kann später komplett entfernt werden.
         */
        #debug-info {
            position: fixed;

            left: 8px;
            bottom: 8px;

            z-index: 99999;

            padding: 6px 8px;

            background: rgba(255, 255, 255, 0.85);

            color: #000000;

            font-size: 12px;
            line-height: 1.3;

            pointer-events: none;
        }

    </style>

</head>


<body>


<div id="screen">


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header id="header">

        <div id="did-you-know">
            Did you know...?
        </div>


        <img
            id="logo"
            src="assets/e3dc-logo.png"
            alt="E3/DC"
        >

    </header>



    <!-- =========================================================
         SLIDE
         ========================================================= -->

    <main id="slide-container">

        <div class="message">
            Slide wird geladen...
        </div>

    </main>



    <!-- =========================================================
         QR-CODE
         ========================================================= -->

    <div id="qr-area">

        <div id="qr-code"></div>

        <div id="qr-label">
            Mehr erfahren:<br>
            Learn more:
        </div>

    </div>



    <!-- =========================================================
         DEBUG-INFORMATIONEN
         ========================================================= -->

    <div id="debug-info"></div>


</div>



<!-- =============================================================
     QR-CODE BIBLIOTHEK
     ============================================================= -->

<script src="assets/qrcode.min.js"></script>



<script>

    /* =============================================================
       KONFIGURATION
       ============================================================= */

    const slideDuration = 30000;



    /* =============================================================
       STATUS
       ============================================================= */

    let slides = [];

    let currentSlide = -1;

    let slideTimer = null;

    let loadVersion = 0;



    /* =============================================================
       SLIDE-LISTE LADEN
       ============================================================= */

    async function loadSlideList() {

        const container =
            document.getElementById(
                "slide-container"
            );


        try {

            const response = await fetch(
                "slides.json",
                {
                    cache: "no-store"
                }
            );


            if (!response.ok) {

                throw new Error(
                    "slides.json konnte nicht geladen werden."
                );

            }


            slides = await response.json();


            if (!Array.isArray(slides)) {

                throw new Error(
                    "slides.json enthält keine gültige Liste."
                );

            }


            if (slides.length === 0) {

                container.innerHTML = `
                    <div class="message">
                        Keine Slides vorhanden.
                    </div>
                `;

                return;

            }


            /*
             * Beim Start eine zufällige Slide auswählen.
             */
            const firstSlide =
                Math.floor(
                    Math.random() * slides.length
                );


            await showSlide(firstSlide);


            /*
             * Automatischen Wechsel starten.
             */
            startTimer();

        }

        catch (error) {

            console.error(error);


            container.innerHTML = `
                <div class="message">
                    Die Slides konnten nicht geladen werden.
                </div>
            `;

        }

    }



    /* =============================================================
       EINZELNE SLIDE LADEN
       ============================================================= */

    async function showSlide(index) {

        if (slides.length === 0) {
            return;
        }


        /*
         * Nach der letzten Slide wieder zur ersten.
         */
        if (index >= slides.length) {
            index = 0;
        }


        /*
         * Vor der ersten Slide wieder zur letzten.
         */
        if (index < 0) {
            index = slides.length - 1;
        }


        const thisLoadVersion =
            ++loadVersion;


        try {

            const response = await fetch(
                slides[index],
                {
                    cache: "no-store"
                }
            );


            if (!response.ok) {

                throw new Error(
                    "Slide konnte nicht geladen werden: "
                    + slides[index]
                );

            }


            const html =
                await response.text();


            /*
             * Falls zwischenzeitlich bereits eine andere
             * Slide angefordert wurde, diese Antwort ignorieren.
             */
            if (
                thisLoadVersion !== loadVersion
            ) {

                return;

            }


            currentSlide = index;


            const container =
                document.getElementById(
                    "slide-container"
                );


            /*
             * Slide in einen Wrapper setzen.
             *
             * Der gesamte Wrapper kann anschließend
             * proportional skaliert werden.
             */
            container.innerHTML = `
                <div id="slide-content">
                    ${html}
                </div>
            `;


            /*
             * QR-Code erzeugen.
             */
            updateQRCode();


            /*
             * Anschließend prüfen,
             * ob die Slide vollständig hineinpasst.
             */
            await fitSlide();


            /*
             * Debug-Anzeige aktualisieren.
             */
            updateDebugInfo();

        }

        catch (error) {

            console.error(error);


            document.getElementById(
                "slide-container"
            ).innerHTML = `
                <div class="message">
                    Diese Slide konnte nicht geladen werden.
                </div>
            `;

        }

    }



    /* =============================================================
       SLIDE AUTOMATISCH EINPASSEN
       ============================================================= */

    async function fitSlide() {

        const container =
            document.getElementById(
                "slide-container"
            );


        const content =
            document.getElementById(
                "slide-content"
            );


        if (!content) {
            return;
        }


        /*
         * Vor dem Messen immer wieder
         * auf Originalgröße zurücksetzen.
         */
        content.style.transform =
            "scale(1)";


        /*
         * Auf Bilder innerhalb der Slide warten.
         */
        const images =
            content.querySelectorAll("img");


        await Promise.all(

            Array.from(images).map(image => {

                if (image.complete) {

                    return Promise.resolve();

                }


                return new Promise(resolve => {

                    image.addEventListener(
                        "load",
                        resolve,
                        {
                            once: true
                        }
                    );


                    image.addEventListener(
                        "error",
                        resolve,
                        {
                            once: true
                        }
                    );

                });

            })

        );


        /*
         * Zwei Browser-Renderzyklen warten.
         *
         * Dadurch stellen wir sicher, dass Größen,
         * Zeilenumbrüche und Bilder final berechnet wurden.
         */
        await new Promise(resolve => {

            requestAnimationFrame(() => {

                requestAnimationFrame(
                    resolve
                );

            });

        });


        /*
         * Padding des Containers bestimmen.
         */
        const style =
            getComputedStyle(container);


        const horizontalPadding =
            parseFloat(style.paddingLeft) +
            parseFloat(style.paddingRight);


        const verticalPadding =
            parseFloat(style.paddingTop) +
            parseFloat(style.paddingBottom);


        /*
         * Tatsächlich verfügbarer sichtbarer Bereich.
         */
        const availableWidth =
            container.clientWidth -
            horizontalPadding;


        const availableHeight =
            container.clientHeight -
            verticalPadding;


        /*
         * Tatsächliche Größe des Slide-Inhalts.
         */
        const contentWidth =
            content.scrollWidth;


        const contentHeight =
            content.scrollHeight;


        /*
         * Skalierungsfaktor bestimmen.
         *
         * Nie größer als 1.
         * Slides werden also nicht künstlich vergrößert.
         */
        let scale =
            Math.min(
                1,
                availableWidth / contentWidth,
                availableHeight / contentHeight
            );


        /*
         * Kleiner Sicherheitspuffer.
         *
         * Gerade eingebettete Browser auf Signage-Geräten
         * können bei Berechnungen Rundungsabweichungen haben.
         */
        if (scale < 1) {

            scale *= 0.95;

        }


        /*
         * Slide skalieren.
         */
        content.style.transform =
            `scale(${scale})`;


        console.log(
            "Slide:",
            slides[currentSlide],

            "Viewport:",
            window.innerWidth
            + "x"
            + window.innerHeight,

            "Content:",
            contentWidth
            + "x"
            + contentHeight,

            "Available:",
            availableWidth
            + "x"
            + availableHeight,

            "Scale:",
            scale
        );

    }



    /* =============================================================
       QR-CODE
       ============================================================= */

    function updateQRCode() {

        const qrArea =
            document.getElementById(
                "qr-area"
            );


        const qrContainer =
            document.getElementById(
                "qr-code"
            );


        const slideContainer =
            document.getElementById(
                "slide-container"
            );


        /*
         * Eventuellen vorherigen QR-Code entfernen.
         */
        qrContainer.innerHTML = "";


        /*
         * Metadaten der aktuellen Slide suchen.
         */
        const metadata =
            slideContainer.querySelector(
                ".slide-meta"
            );


        /*
         * Keine Metadaten vorhanden.
         */
        if (!metadata) {

            qrArea.style.display =
                "none";

            return;

        }


        /*
         * URL auslesen.
         */
        const url =
            metadata.dataset.qrUrl;


        /*
         * Keine URL angegeben.
         */
        if (!url) {

            qrArea.style.display =
                "none";

            return;

        }


        /*
         * QR-Bereich anzeigen.
         */
        qrArea.style.display =
            "flex";


        /*
         * QR-Code erzeugen.
         *
         * Intern wird eine höhere Auflösung verwendet.
         * CSS skaliert ihn anschließend auf die
         * gewünschte Bildschirmgröße.
         */
        new QRCode(
            qrContainer,
            {
                text: url,

                width: 300,
                height: 300,

                colorDark: "#000000",
                colorLight: "#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );

    }



    /* =============================================================
       ZUFÄLLIGE SLIDE
       ============================================================= */

    function getRandomSlide() {

        /*
         * Bei nur einer Slide kann keine andere
         * ausgewählt werden.
         */
        if (slides.length <= 1) {

            return 0;

        }


        let nextSlide;


        /*
         * So lange würfeln,
         * bis eine andere Slide gefunden wurde.
         */
        do {

            nextSlide =
                Math.floor(
                    Math.random()
                    * slides.length
                );

        }

        while (
            nextSlide === currentSlide
        );


        return nextSlide;

    }



    async function showRandomSlide() {

        const nextSlide =
            getRandomSlide();


        await showSlide(
            nextSlide
        );

    }



    /* =============================================================
       TIMER
       ============================================================= */

    function startTimer() {

        if (slideTimer !== null) {

            clearInterval(
                slideTimer
            );

        }


        slideTimer =
            setInterval(

                () => {

                    showRandomSlide();

                },

                slideDuration

            );

    }



    /* =============================================================
       MANUELLE NAVIGATION
       ============================================================= */

    async function nextSlide() {

        await showSlide(
            currentSlide + 1
        );


        /*
         * Nach manueller Navigation
         * beginnen die 30 Sekunden neu.
         */
        startTimer();

    }



    async function previousSlide() {

        await showSlide(
            currentSlide - 1
        );


        startTimer();

    }



    /* =============================================================
       TASTATURSTEUERUNG
       ============================================================= */

    document.addEventListener(

        "keydown",

        event => {

            /*
             * Pfeil nach rechts
             */
            if (
                event.key ===
                "ArrowRight"
            ) {

                event.preventDefault();

                nextSlide();

            }


            /*
             * Pfeil nach links
             */
            else if (
                event.key ===
                "ArrowLeft"
            ) {

                event.preventDefault();

                previousSlide();

            }

        }

    );



    /* =============================================================
       DEBUG-INFORMATIONEN
       ============================================================= */

    function updateDebugInfo() {

        const debug =
            document.getElementById(
                "debug-info"
            );


        debug.innerHTML =
            "Viewport: "
            + window.innerWidth
            + " × "
            + window.innerHeight

            + " | Screen: "
            + window.screen.width
            + " × "
            + window.screen.height

            + " | DPR: "
            + window.devicePixelRatio;

    }



    /* =============================================================
       ÄNDERUNG DER BROWSERGRÖSSE
       ============================================================= */

    window.addEventListener(
        "resize",
        async () => {

            updateDebugInfo();

            await fitSlide();

        }
    );



    /* =============================================================
       START
       ============================================================= */

    updateDebugInfo();

    loadSlideList();


</script>


</body>

</html>
