<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>E3/DC – Did you know?</title>


    <style>

        /* =========================================================
           GRUNDEINSTELLUNGEN
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background: #ffffff;
            color: #1a1a1a;
        }


        /* =========================================================
           GESAMTER 1920x1080 BILDSCHIRM
           ========================================================= */

        #screen {
			position: absolute;

			width: 1920px;
			height: 1080px;

			background: #ffffff;
			overflow: hidden;

			transform-origin: top left;
		}


        /* =========================================================
           HEADER
           ========================================================= */

        #header {
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 120px;

            display: flex;

            align-items: center;
            justify-content: space-between;

            padding: 25px 70px 20px 55px;

            z-index: 100;
        }


        /* "Did you know...?" */

        #did-you-know {
            font-size: 32px;
            font-weight: 600;

            color: #555555;
        }


        /* E3/DC Logo */

        #logo {
            width: 220px;
            height: auto;

            object-fit: contain;
        }


        /* =========================================================
           SLIDE-BEREICH
           ========================================================= */

        #slide-container {
            position: absolute;

            top: 120px;
            left: 0;

            width: 100%;
            height: 960px;

            padding:
                0
                90px
                55px
                82px;

            overflow: hidden;

            /*
             * Diese Größe ist die maximale Basis-Schriftgröße.
             * JavaScript reduziert sie automatisch,
             * wenn der Inhalt nicht auf den Bildschirm passt.
             */
            font-size: 32px;
        }


        /* =========================================================
           DEUTSCHER BEREICH
           ========================================================= */

        .german {
            margin-bottom: 1.45em;
        }


        /* =========================================================
           ENGLISCHER BEREICH
           ========================================================= */

        .english {
            border-top: 2px solid #dddddd;

            padding-top: 1.2em;
        }


        /* =========================================================
           ÜBERSCHRIFTEN
           ========================================================= */

        h1 {
            margin:
                0
                0
                0.55em
                0;

            font-size: 1.65em;
            line-height: 1.15;

            font-weight: 700;
        }


        h2 {
            margin:
                0
                0
                0.55em
                0;

            font-size: 1.35em;
            line-height: 1.15;

            font-weight: 700;
        }


        /* =========================================================
           NORMALER INHALT
           ========================================================= */

        .content {
            font-size: 1em;
            line-height: 1.4;
        }


        .content p {
            margin:
                0
                0
                0.65em
                0;
        }


        /* =========================================================
           LISTEN
           ========================================================= */

        .content ul,
        .content ol {
            margin:
                0.35em
                0
                0.7em
                0;

            padding-left: 1.2em;
        }


        .content li {
            margin-bottom: 0.15em;
        }


        /* =========================================================
           BILDER
           ========================================================= */

        .content img {
            max-width: 100%;
            max-height: 320px;

            object-fit: contain;
        }


        /* =========================================================
           ZWEISPALTIGES LAYOUT
           ========================================================= */

        .two-columns {
            display: flex;

            gap: 2em;

            align-items: center;
        }


        .two-columns > div {
            flex: 1;

            min-width: 0;
        }


        .two-columns img {
            display: block;

            max-width: 100%;
            max-height: 300px;

            margin: 0 auto;

            object-fit: contain;
        }


        /* =========================================================
           TABELLEN
           ========================================================= */

        .content table {
            width: 100%;

            border-collapse: collapse;
        }


        .content th,
        .content td {
            padding: 0.35em 0.5em;

            border-bottom: 1px solid #dddddd;

            text-align: left;
        }


        /* =========================================================
           FEHLERMELDUNGEN
           ========================================================= */

        .message {
            padding-top: 100px;

            font-size: 32px;
            color: #555555;
        }
		
		/* =========================================================
           QR
	     ========================================================= */
		
		#qr-area {
			position: absolute;

			right: 55px;
			bottom: 40px;

			z-index: 200;

			display: none;

			align-items: center;
			gap: 18px;

			padding: 12px;

			background: #ffffff;
		}


		#qr-code {
			width: 140px;
			height: 140px;
		}


		#qr-code img,
		#qr-code canvas {
			display: block;

			width: 140px !important;
			height: 140px !important;
		}


		#qr-label {
			font-size: 20px;
			line-height: 1.3;

			color: #555555;
		}

    </style>

</head>


<body>


<div id="screen">


    <!-- =========================================================
         HEADER
         ========================================================= -->

    <header id="header">

        <div id="did-you-know">
            Did you know...?
        </div>


        <img
            id="logo"
            src="assets/logo.png"
            alt="E3/DC"
        >

    </header>


    <!-- =========================================================
         HIER WIRD DIE AKTUELLE SLIDE GELADEN
         ========================================================= -->

    <main id="slide-container">

        <div class="message">
            Slide wird geladen...
        </div>

    </main>
	
	<div id="qr-area">

    <div id="qr-code"></div>

    <div id="qr-label">
        Mehr erfahren<br>
        Learn more
    </div>

</div>


</div>

<script src="assets/qrcode.min.js"></script>

<script>

    /* =============================================================
       KONFIGURATION
       ============================================================= */


    /*
     * Dauer einer Slide in Millisekunden.
     *
     * 30.000 ms = 30 Sekunden
     */
    const slideDuration = 30000;


    /*
     * Maximale Basis-Schriftgröße.
     */
    const maximumFontSize = 32;


    /*
     * Kleinste erlaubte Schriftgröße.
     *
     * Wenn der Inhalt selbst damit nicht hineinpasst,
     * wird nicht weiter verkleinert.
     */
    const minimumFontSize = 22;



    /* =============================================================
       STATUS
       ============================================================= */

    let slides = [];

    let currentSlide = -1;

    let slideTimer = null;


    /*
     * Verhindert, dass bei sehr schnellem Wechseln
     * eine ältere Ladeanfrage später eine neuere überschreibt.
     */
    let loadVersion = 0;



    /* =============================================================
       SLIDE-LISTE LADEN
       ============================================================= */

    async function loadSlideList() {

        const container =
            document.getElementById("slide-container");


        try {

            const response = await fetch(
                "slides.json",
                {
                    cache: "no-store"
                }
            );


            if (!response.ok) {

                throw new Error(
                    "slides.json konnte nicht geladen werden."
                );

            }


            slides = await response.json();


            if (!Array.isArray(slides)) {

                throw new Error(
                    "slides.json enthält keine gültige Liste."
                );

            }


            if (slides.length === 0) {

                container.innerHTML = `
                    <div class="message">
                        Keine Slides vorhanden.
                    </div>
                `;

                return;

            }


            /*
             * Beim Start eine zufällige Slide auswählen.
             */
            const firstSlide = Math.floor(
                Math.random() * slides.length
            );


            await showSlide(firstSlide);


            /*
             * Automatischen Wechsel starten.
             */
            startTimer();


        }
        catch (error) {

            console.error(error);


            container.innerHTML = `
                <div class="message">
                    Die Slides konnten nicht geladen werden.
                </div>
            `;

        }

    }



    /* =============================================================
       EINZELNE SLIDE LADEN
       ============================================================= */

    async function showSlide(index) {

        if (slides.length === 0) {
            return;
        }


        /*
         * Hinter der letzten Slide wieder zur ersten.
         */
        if (index >= slides.length) {
            index = 0;
        }


        /*
         * Vor der ersten Slide wieder zur letzten.
         */
        if (index < 0) {
            index = slides.length - 1;
        }


        const thisLoadVersion = ++loadVersion;


        try {

            const response = await fetch(
                slides[index],
                {
                    cache: "no-store"
                }
            );


            if (!response.ok) {

                throw new Error(
                    "Slide konnte nicht geladen werden: "
                    + slides[index]
                );

            }


            const html = await response.text();


            /*
             * Falls zwischenzeitlich bereits eine andere Slide
             * angefordert wurde, diese Antwort ignorieren.
             */
            if (thisLoadVersion !== loadVersion) {
                return;
            }


            currentSlide = index;


            const container =
                document.getElementById(
                    "slide-container"
                );


            /*
             * Zunächst immer wieder die maximale Schriftgröße setzen.
             *
             * Wichtig, weil die vorherige Slide eventuell
             * automatisch verkleinert wurde.
             */
            container.style.fontSize =
                maximumFontSize + "px";


            /*
             * Neue Slide einsetzen.
             */
            container.innerHTML = html;

			updateQRCode();

            /*
             * Anschließend prüfen, ob alles hineinpasst.
             */
            await fitSlide();


        }
        catch (error) {

            console.error(error);


            document.getElementById(
                "slide-container"
            ).innerHTML = `
                <div class="message">
                    Diese Slide konnte nicht geladen werden.
                </div>
            `;

        }

    }



    /* =============================================================
       AUTOMATISCHE SCHRIFTGRÖSSE
       ============================================================= */

    async function fitSlide() {

        const container =
            document.getElementById(
                "slide-container"
            );


        /*
         * Erst mit maximaler Größe beginnen.
         */
        let fontSize = maximumFontSize;


        container.style.fontSize =
            fontSize + "px";


        /*
         * Bilder können die endgültige Größe des Inhalts verändern.
         *
         * Deshalb warten wir zunächst,
         * bis alle Bilder der aktuellen Slide geladen wurden.
         */
        const images =
            container.querySelectorAll("img");


        await Promise.all(

            Array.from(images).map(image => {

                /*
                 * Bild ist bereits geladen.
                 */
                if (image.complete) {
                    return Promise.resolve();
                }


                /*
                 * Warten bis das Bild entweder geladen wurde
                 * oder ein Fehler auftritt.
                 */
                return new Promise(resolve => {

                    image.addEventListener(
                        "load",
                        resolve,
                        {
                            once: true
                        }
                    );


                    image.addEventListener(
                        "error",
                        resolve,
                        {
                            once: true
                        }
                    );

                });

            })

        );


        /*
         * Einen Render-Zyklus warten.
         *
         * Dadurch kennt der Browser nach dem Laden der Bilder
         * die endgültige Größe des Inhalts.
         */
        await new Promise(resolve => {

            requestAnimationFrame(() => {

                requestAnimationFrame(resolve);

            });

        });


        /*
         * Schrift schrittweise verkleinern,
         * bis der gesamte Inhalt sichtbar ist.
         */
        while (
            contentDoesNotFit(container)
            &&
            fontSize > minimumFontSize
        ) {

            fontSize--;

            container.style.fontSize =
                fontSize + "px";

        }


        /*
         * Falls selbst die Mindestgröße noch nicht ausreicht,
         * bleibt sie erhalten.
         *
         * Die Slide enthält dann schlicht zu viel Inhalt.
         */
        if (contentDoesNotFit(container)) {

            console.warn(
                "Slide passt auch mit "
                + minimumFontSize
                + "px nicht vollständig auf den Bildschirm:",
                slides[currentSlide]
            );

        }


        console.log(
            "Slide:",
            slides[currentSlide],
            "Schriftgröße:",
            fontSize + "px"
        );

    }



    /* =============================================================
       PRÜFEN, OB DER INHALT HINEINPASST
       ============================================================= */

    function contentDoesNotFit(container) {

        return (
            container.scrollHeight >
            container.clientHeight
            ||
            container.scrollWidth >
            container.clientWidth
        );

    }



    /* =============================================================
       ZUFÄLLIGE SLIDE BESTIMMEN
       ============================================================= */

    function getRandomSlide() {

        /*
         * Gibt es nur eine Slide,
         * muss diese wieder angezeigt werden.
         */
        if (slides.length <= 1) {
            return 0;
        }


        let nextSlide;


        /*
         * So lange würfeln,
         * bis eine andere Slide gefunden wurde.
         */
        do {

            nextSlide = Math.floor(
                Math.random() * slides.length
            );

        }
        while (
            nextSlide === currentSlide
        );


        return nextSlide;

    }



    /* =============================================================
       ZUFÄLLIGE SLIDE ANZEIGEN
       ============================================================= */

    async function showRandomSlide() {

        const nextSlide =
            getRandomSlide();


        await showSlide(nextSlide);

    }



    /* =============================================================
       TIMER
       ============================================================= */

    function startTimer() {

        /*
         * Vorherigen Timer beenden.
         */
        if (slideTimer !== null) {

            clearInterval(slideTimer);

        }


        /*
         * Neuen 30-Sekunden-Timer starten.
         */
        slideTimer = setInterval(

            () => {

                showRandomSlide();

            },

            slideDuration

        );

    }



    /* =============================================================
       NÄCHSTE SLIDE
       ============================================================= */

    async function nextSlide() {

        await showSlide(
            currentSlide + 1
        );


        /*
         * Nach manueller Bedienung beginnen
         * die 30 Sekunden wieder von vorne.
         */
        startTimer();

    }



    /* =============================================================
       VORHERIGE SLIDE
       ============================================================= */

    async function previousSlide() {

        await showSlide(
            currentSlide - 1
        );


        /*
         * Nach manueller Bedienung beginnen
         * die 30 Sekunden wieder von vorne.
         */
        startTimer();

    }



    /* =============================================================
       TASTATURSTEUERUNG
       ============================================================= */

    document.addEventListener(

        "keydown",

        event => {

            /*
             * Pfeil nach rechts:
             * nächste Slide
             */
            if (event.key === "ArrowRight") {

                event.preventDefault();

                nextSlide();

            }


            /*
             * Pfeil nach links:
             * vorherige Slide
             */
            else if (event.key === "ArrowLeft") {

                event.preventDefault();

                previousSlide();

            }

        }

    );
	
	    /* =============================================================
       QR
       ============================================================= */
	
	function updateQRCode() {

    const qrArea =
        document.getElementById("qr-area");

    const qrContainer =
        document.getElementById("qr-code");

    const slideContainer =
        document.getElementById("slide-container");


    /*
     * Metadaten der aktuellen Slide suchen.
     */
    const metadata =
        slideContainer.querySelector(".slide-meta");


    /*
     * Alten QR-Code entfernen.
     */
    qrContainer.innerHTML = "";


    /*
     * Keine Metadaten vorhanden?
     * Dann QR-Bereich ausblenden.
     */
    if (!metadata) {

        qrArea.style.display = "none";

        return;
    }


    /*
     * URL auslesen.
     */
    const url =
        metadata.dataset.qrUrl;


    /*
     * Keine URL eingetragen?
     */
    if (!url) {

        qrArea.style.display = "none";

        return;
    }


    /*
     * QR-Bereich anzeigen.
     */
    qrArea.style.display = "flex";


    /*
     * QR-Code erzeugen.
     */
    new QRCode(
        qrContainer,
        {
            text: url,
            width: 280,
            height: 280,

            correctLevel:
                QRCode.CorrectLevel.H
        }
    );

}

function scaleScreen() {

    const screen =
        document.getElementById("screen");

    const scaleX =
        window.innerWidth / 1920;

    const scaleY =
        window.innerHeight / 1080;

    const scale =
        Math.min(scaleX, scaleY);

    screen.style.transform =
        `scale(${scale})`;

    screen.style.left =
        ((window.innerWidth - 1920 * scale) / 2)
        + "px";

    screen.style.top =
        ((window.innerHeight - 1080 * scale) / 2)
        + "px";
}

window.addEventListener(
    "resize",
    scaleScreen
);



    /* =============================================================
       START
       ============================================================= */

    loadSlideList();
	scaleScreen();


</script>


</body>

</html>
